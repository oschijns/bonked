[package]
name = "bonked3d_level"
description = "Simple 3D collision engine"
authors.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true


# Compile Features
[features]
default = ["parry-f32", "std"]

# enable support for the standard library
std = ["bincode/std", "parry3d?/std", "parry3d-f64?/std"]

# Specify which parry variant should be used as a dependency
parry-f32 = ["dep:parry3d"]
parry-f64 = ["dep:parry3d-f64"]


[dependencies]

# Convex decomposition and building colliders
parry3d = { version = "0.23", features = [
    "required-features",
    "alloc",
], default-features = false, optional = true }
parry3d-f64 = { version = "0.23", features = [
    "required-features",
    "alloc",
], default-features = false, optional = true }

# binary serialization
bincode = { version = "2.0", features = [
    "derive",
    "alloc",
], default-features = false }

# bitmask of vertex data
bitfield = "0.19"

# numeric traits
num-traits = "0.2"

# type size check
#unty = "0.0"
