[workspace]
members = [
    "crates/bonked2d",
    "crates/bonked3d",
    "crates/bonked3d_level",
    "crates/bonked3d_level_maker",
]
resolver = "2"

[workspace.package]
description = "simple collision engine for retro console development"
authors = ["Olivier Schyns <https://github.com/oschijns>"]
repository = "https://github.com/oschijns/bonked"
version = "0.0.4"
edition = "2024"
license = "MIT"

[workspace.dependencies]

# Hashbrown to have hash maps in no_std environment
hashbrown = "0.16"

# Delegate methods from internal fields
delegate = "0.13"


[patch.crates-io]
bonked2d = { path = "crates/bonked2d" }
bonked3d = { path = "crates/bonked3d" }
